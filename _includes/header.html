<header class="site-header" role="banner">
  <div class="wrapper">

    <!-- BIG homepage link -->
    <a class="site-title custom-home-link" rel="author" href="{{ "/" | relative_url }}">
      {{ site.title | escape }}
    </a>

    <!-- Normal navigation menu -->
    <nav class="site-nav">
      {% for my_page in site.pages %}
        {% if my_page.url != "/" %}
          <a class="page-link" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
        {% endif %}
      {% endfor %}
    </nav>

  </div>
</header>

<style>
/* Big homepage link */
.custom-home-link {
  font-size: 1.8rem;
  font-weight: 700;
  margin-right: 3rem;
  text-decoration: none;
  color: inherit;
  vertical-align: middle;
}

/* Navigation links on the right, horizontal */
.site-nav {
  display: inline-block;
  vertical-align: middle;
}

.site-nav .page-link {
  margin-right: 1.5rem;
  text-decoration: none;
  font-weight: 500;
  color: inherit;
  display: inline-grid;
  height: 100%;
  transition: background .5s, color .5s;
}

.site-nav .page-link:hover {
  background-color: #222;
  color: #aaa;
}

.site-nav .page-link:last-child {
  margin-right: 0;
}

/* Header layout: align homepage left, nav right */
.site-header .wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
</style>
